<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CampusHub – Student Management System</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root{
  --bg:#f8fafc;
  --card:#ffffff;
  --fg:#0f172a;
  --mut:#64748b;
  --bd:#e2e8f0;
  --soft:#f1f5f9;
  --primary:#4f46e5;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px)
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b1020;
    --card:#151b2e;
    --fg:#e2e8f0;
    --mut:#94a3b8;
    --bd:#25304a;
    --soft:#1e2547;
    --primary:#6366f1
  }
}
:root[data-theme="dark"]{
  --bg:#0b1020;
  --card:#151b2e;
  --fg:#e2e8f0;
  --mut:#94a3b8;
  --bd:#25304a;
  --soft:#1e2547;
  --primary:#6366f1
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--fg);font-family:Inter,ui-sans-serif,system-ui,sans-serif;margin:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:0.875rem;padding:1.25rem;box-shadow:0 1px 3px rgba(15,23,42,.05)}
.mut{color:var(--mut)}.bd{border-color:var(--bd)}.soft{background:var(--soft)}
.nav{display:flex;align-items:center;gap:.6rem;padding:.65rem .95rem;border-radius:.75rem;color:var(--mut);font-weight:500;font-size:.9rem;white-space:nowrap;cursor:pointer;border:0;background:none;text-align:left;transition:all .15s}
.nav:hover{background:var(--soft);color:var(--fg)}.nav.on{background:var(--primary);color:#fff}
.btn{background:var(--primary);color:#fff;border-radius:.75rem;padding:.65rem 1rem;font-weight:600;width:100%;border:0;cursor:pointer;transition:opacity .15s}.btn:hover{opacity:.92}
.inp{width:100%;padding:.65rem .85rem;border-radius:.75rem;border:1px solid var(--bd);background:var(--card);color:var(--fg);outline:none;transition:border-color .15s}.inp:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.18)}

/* Strict Professional Table Styling */
table{width:100%;border-collapse:collapse;font-size:.875rem;line-height:1.35}
th{color:var(--mut);font-weight:600;padding:.75rem .85rem;background:var(--soft);border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:.75rem .85rem;border-top:1px solid var(--bd);vertical-align:middle}
tfoot td{background:var(--soft);font-weight:700;border-top:2px solid var(--bd);color:var(--fg)}
tr:hover td{background:rgba(99,102,241,.03)}
tfoot tr:hover td{background:var(--soft)}
.wrap{overflow-x:auto;border-radius:.75rem;border:1px solid var(--bd);background:var(--card)}

/* Table Text Alignment Helpers */
.txt-left{text-align:left}
.txt-right{text-align:right;font-variant-numeric:tabular-nums}
.txt-center{text-align:center}
</style>
</head>
<body>
<div id="app"></div>

<script>
// ---------- Core Mock Data ----------
const USERS = { CS21B042: { pw: 'student123' } };
const ME = {
  name: 'Aarav Sharma',
  roll: 'CS21B042',
  dept: 'Computer Science & Engineering',
  program: 'B.Tech',
  sem: 5,
  email: 'aarav.sharma@campus.edu',
  cgpa: 8.12
};

const SUBJ = [
  { n: 'Data Structures', c: 'CS301', att: 38, tot: 44, mid: 41, end: 78, dept: 71, weak: [] },
  { n: 'Database Systems', c: 'CS302', att: 30, tot: 42, mid: 36, end: 71, dept: 68, weak: ['Normalization (BCNF)'] },
  { n: 'Operating Systems', c: 'CS303', att: 26, tot: 40, mid: 28, end: 58, dept: 66, weak: ['Deadlocks', 'Virtual memory'] },
  { n: 'Computer Networks', c: 'CS304', att: 33, tot: 41, mid: 39, end: 82, dept: 70, weak: [] },
  { n: 'Discrete Mathematics', c: 'MA305', att: 24, tot: 38, mid: 30, end: 52, dept: 64, weak: ['Graph theory', 'Recurrence relations'] }
];

const PEERS = [
  ['Ishita Rao', 88],
  ['Kabir Mehta', 84],
  ['Neha Verma', 80],
  ['Rohan Das', 74],
  ['Sara Khan', 72],
  ['Vikram Singh', 69],
  ['Ananya Iyer', 66],
  ['Dev Patel', 61],
  ['Meera Nair', 57]
];

// Calculations
const pct = s => Math.round((s.mid + s.end) / 150 * 100);
const attp = s => Math.round(s.att / s.tot * 100);
const grade = p => p >= 90 ? 'O' : p >= 80 ? 'A+' : p >= 70 ? 'A' : p >= 60 ? 'B' : p >= 50 ? 'C' : 'F';
const avg = a => Math.round(a.reduce((x, y) => x + y, 0) / a.length);
const myAvg = avg(SUBJ.map(pct));
const deptAvg = avg(SUBJ.map(s => s.dept));
const board = [...PEERS, [ME.name, myAvg]].sort((a, b) => b[1] - a[1]);
const rank = board.findIndex(r => r[0] === ME.name) + 1;

// Totals across courses
const totalAttended = SUBJ.reduce((sum, s) => sum + s.att, 0);
const totalHeld = SUBJ.reduce((sum, s) => sum + s.tot, 0);
const totalMissed = totalHeld - totalAttended;
const overallAttPct = Math.round(totalAttended / totalHeld * 100);
const totalMid = SUBJ.reduce((sum, s) => sum + s.mid, 0);
const totalEnd = SUBJ.reduce((sum, s) => sum + s.end, 0);
const totalMaxMid = SUBJ.length * 50;
const totalMaxEnd = SUBJ.length * 100;
const grandTotalScore = totalMid + totalEnd;
const grandTotalMax = totalMaxMid + totalMaxEnd;
const overallExamPct = Math.round(grandTotalScore / grandTotalMax * 100);

let S = { user: null, tab: 'overview', err: '' };
const TABS = [
  ['overview', '🏠', 'Overview'],
  ['attendance', '📅', 'Attendance'],
  ['marks', '📝', 'Marks & Insights'],
  ['leaderboard', '🏆', 'Leaderboard'],
  ['faculty', '🧑‍🏫', 'Faculty & Blocks']
];

// ---------- Badges and Stat Helpers ----------
const badge = (txt, bg, fg) => `<span class="inline-block px-2.5 py-0.5 rounded-md text-xs font-semibold" style="background:${bg};color:${fg}">${txt}</span>`;
const statusBadge = p => p < 60 ? badge('Needs Focus', '#fee2e2', '#b91c1c') : p < 75 ? badge('Satisfactory', '#fef3c7', '#92400e') : badge('Proficient', '#d1fae5', '#047857');
const stat = (l, v, s = '') => `<div class="card"><div class="mut text-sm">${l}</div><div class="text-2xl font-bold mt-1">${v}</div><div class="mut text-xs mt-1">${s}</div></div>`;
const head = (t, s) => `<div class="mb-5"><h1 class="text-2xl font-bold">${t}</h1><p class="mut text-sm">${s}</p></div>`;

// ---------- Views ----------

function loginView() {
  return `<div class="min-h-screen flex items-center justify-center p-4" style="background:linear-gradient(135deg,#312e81,#4f46e5 55%,#818cf8)">
<div class="card w-full max-w-md" style="padding:2.25rem">
  <div class="text-center mb-6">
    <div class="text-4xl">🎓</div>
    <h1 class="text-2xl font-bold mt-2">CampusHub</h1>
    <p class="mut text-sm">Student Academic Management Portal</p>
  </div>
  <form onsubmit="login(event)" class="space-y-4">
    <div>
      <label class="text-sm font-medium">Roll Number</label>
      <input id="u" class="inp mt-1" value="CS21B042" autocomplete="username">
    </div>
    <div>
      <label class="text-sm font-medium">Password</label>
      <input id="p" type="password" class="inp mt-1" value="student123" autocomplete="current-password">
    </div>
    ${S.err ? `<div class="text-sm rounded-lg p-2.5" style="background:#fee2e2;color:#b91c1c">${S.err}</div>` : ''}
    <button class="btn">Sign In to Dashboard</button>
  </form>
  <p class="mut text-xs text-center mt-4">Demo Credentials: <b>CS21B042</b> / <b>student123</b></p>
</div></div>`;
}

// 1. OVERVIEW VIEW
function overview() {
  const lowCount = SUBJ.filter(s => attp(s) < 75).length;

  // Grade frequency counts (replaces Histogram/Pie Chart)
  const gradeBuckets = [
    { grade: 'A+ (80% - 89%)', min: 80, max: 89, desc: 'Excellent' },
    { grade: 'A (70% - 79%)', min: 70, max: 79, desc: 'Very Good' },
    { grade: 'C (50% - 59%)', min: 50, max: 59, desc: 'Needs Improvement' }
  ];

  return head('Welcome back, ' + ME.name.split(' ')[0] + ' 👋', 'Academic Performance Overview for Semester ' + ME.sem) + `
<div class="card flex flex-col sm:flex-row gap-4 items-start sm:items-center mb-5" style="background:linear-gradient(120deg,#4f46e5,#6366f1);color:#fff;border:0">
  <div class="w-16 h-16 rounded-full flex items-center justify-center text-2xl font-bold" style="background:rgba(255,255,255,.2)">${ME.name.split(' ').map(x=>x[0]).join('')}</div>
  <div class="flex-1">
    <div class="text-xl font-bold">${ME.name}</div>
    <div class="text-sm opacity-90">${ME.email}</div>
  </div>
  <div class="grid grid-cols-2 gap-x-8 gap-y-1 text-sm">
    <span class="opacity-80">Roll Number</span><b>${ME.roll}</b>
    <span class="opacity-80">Degree Program</span><b>${ME.program}</b>
    <span class="opacity-80">Current Semester</span><b>Semester ${ME.sem}</b>
    <span class="opacity-80">Department</span><b>CSE</b>
  </div>
</div>

<div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-5">
  ${stat('Cumulative CGPA', ME.cgpa, 'Scale of 10.00')}
  ${stat('Overall Attendance', overallAttPct + '%', totalAttended + ' / ' + totalHeld + ' Classes')}
  ${stat('Average Exam Score', myAvg + '%', 'Dept Cohort Avg: ' + deptAvg + '%')}
  ${stat('Department Rank', '#' + rank, 'Out of ' + board.length + ' Enrolled Students')}
</div>

<!-- Table 1: Complete Academic Course Performance Table -->
<div class="card mb-5">
  <div class="flex items-center justify-between mb-3">
    <div>
      <h3 class="font-semibold text-base">📊 Semester Course Performance & Enrollment Data Table</h3>
      <p class="mut text-xs">Summary of current academic standing across all registered courses</p>
    </div>
    <span class="text-xs mut">5 Registered Courses</span>
  </div>
  <div class="wrap">
    <table>
      <thead>
        <tr>
          <th class="txt-center">Code</th>
          <th class="txt-left">Course Title</th>
          <th class="txt-right">Attended</th>
          <th class="txt-right">Total Held</th>
          <th class="txt-right">Attendance %</th>
          <th class="txt-right">Mid-Term (/50)</th>
          <th class="txt-right">End-Term (/100)</th>
          <th class="txt-right">Total (/150)</th>
          <th class="txt-right">Final %</th>
          <th class="txt-center">Grade</th>
          <th class="txt-center">Academic Status</th>
        </tr>
      </thead>
      <tbody>
        ${SUBJ.map(s => {
          const p = pct(s), a = attp(s), tot = s.mid + s.end;
          return `<tr>
            <td class="txt-center font-mono text-xs mut font-semibold">${s.c}</td>
            <td class="txt-left"><b>${s.n}</b></td>
            <td class="txt-right">${s.att}</td>
            <td class="txt-right">${s.tot}</td>
            <td class="txt-right font-semibold" style="color:${a < 75 ? '#dc2626' : '#16a34a'}">${a}%</td>
            <td class="txt-right">${s.mid}</td>
            <td class="txt-right">${s.end}</td>
            <td class="txt-right font-semibold">${tot}</td>
            <td class="txt-right font-bold">${p}%</td>
            <td class="txt-center"><span class="px-2 py-0.5 rounded text-xs font-bold" style="background:${p < 60 ? '#fee2e2' : 'var(--soft)'};color:${p < 60 ? '#b91c1c' : '#4f46e5'}">${grade(p)}</span></td>
            <td class="txt-center">${statusBadge(p)}</td>
          </tr>`;
        }).join('')}
      </tbody>
      <tfoot>
        <tr>
          <td class="txt-center" colspan="2">Total / Overall Average</td>
          <td class="txt-right">${totalAttended}</td>
          <td class="txt-right">${totalHeld}</td>
          <td class="txt-right" style="color:${overallAttPct < 75 ? '#dc2626' : '#16a34a'}">${overallAttPct}%</td>
          <td class="txt-right">${totalMid} / ${totalMaxMid}</td>
          <td class="txt-right">${totalEnd} / ${totalMaxEnd}</td>
          <td class="txt-right">${grandTotalScore} / ${grandTotalMax}</td>
          <td class="txt-right">${overallExamPct}%</td>
          <td class="txt-center">${grade(overallExamPct)}</td>
          <td class="txt-center">${statusBadge(overallExamPct)}</td>
        </tr>
      </tfoot>
    </table>
  </div>
</div>

<!-- Table 2: Grade Distribution Frequency Table (Replaces Histogram / Donut Chart) -->
<div class="grid lg:grid-cols-2 gap-5">
  <div class="card">
    <div class="flex items-center justify-between mb-3">
      <div>
        <h3 class="font-semibold text-base">📈 Course Grade Distribution Table</h3>
        <p class="mut text-xs">Tabular breakdown of course outcomes by grade band</p>
      </div>
      <span class="text-xs mut">Outcome Distribution</span>
    </div>
    <div class="wrap">
      <table>
        <thead>
          <tr>
            <th class="txt-left">Grade Bracket</th>
            <th class="txt-left">Classification</th>
            <th class="txt-right">Subject Count</th>
            <th class="txt-right">Share of Curriculum</th>
            <th class="txt-left">Enrolled Courses</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="txt-left font-semibold">Grade A+ (80% - 89%)</td>
            <td class="txt-left">${badge('Excellent', '#d1fae5', '#047857')}</td>
            <td class="txt-right">1</td>
            <td class="txt-right">20%</td>
            <td class="txt-left text-xs">Computer Networks (81%)</td>
          </tr>
          <tr>
            <td class="txt-left font-semibold">Grade A (70% - 79%)</td>
            <td class="txt-left">${badge('Very Good', '#e0e7ff', '#3730a3')}</td>
            <td class="txt-right">2</td>
            <td class="txt-right">40%</td>
            <td class="txt-left text-xs">Data Structures (79%), Database Systems (71%)</td>
          </tr>
          <tr>
            <td class="txt-left font-semibold">Grade C (50% - 59%)</td>
            <td class="txt-left">${badge('Needs Remediation', '#fee2e2', '#b91c1c')}</td>
            <td class="txt-right">2</td>
            <td class="txt-right">40%</td>
            <td class="txt-left text-xs">Operating Systems (57%), Discrete Mathematics (55%)</td>
          </tr>
        </tbody>
        <tfoot>
          <tr>
            <td class="txt-left" colspan="2">Curriculum Total</td>
            <td class="txt-right">5 Subjects</td>
            <td class="txt-right">100%</td>
            <td class="txt-left text-xs font-normal">All registered courses evaluated</td>
          </tr>
        </tfoot>
      </table>
    </div>
  </div>

  <div class="card">
    <div class="flex items-center justify-between mb-3">
      <div>
        <h3 class="font-semibold text-base">🔔 Actionable Alerts & Institutional Notices</h3>
        <p class="mut text-xs">Administrative status and recovery directives</p>
      </div>
    </div>
    <div class="space-y-3">
      ${lowCount > 0
        ? `<div class="rounded-xl p-3.5 text-sm" style="background:#fee2e2;color:#991b1b;border:1px solid #fecaca">
            <b>⚠️ Attendance Shortage Warning:</b> You are currently below the statutory 75% requirement in <b>${lowCount}</b> subjects (Operating Systems & Discrete Mathematics). See Attendance tab for recovery criteria.
          </div>`
        : `<div class="rounded-xl p-3.5 text-sm" style="background:#d1fae5;color:#065f46">
            <b>✅ Attendance Compliant:</b> You meet all minimum institutional standards across all enrolled courses.
          </div>`}
      <div class="rounded-xl p-3.5 text-sm soft border bd">
        <b>💡 AI Academic Diagnostic:</b> Specific learning gaps identified in <b>3</b> subjects. Dedicated remedial study plans are documented in the Marks & Insights section.
      </div>
      <div class="rounded-xl p-3.5 text-sm soft border bd">
        <b>🏛️ Department Coordination:</b> Turing Block (Academic Block A), Cabin A-301. Office hours: Monday–Friday, 9:00 AM – 5:00 PM.
      </div>
    </div>
  </div>
</div>`;
}

// 2. ATTENDANCE VIEW (Replaces Circular Progress Charts & Meters)
function attendance() {
  const lowCount = SUBJ.filter(s => attp(s) < 75).length;

  return head('Attendance Register & Regulatory Compliance', 'Course-by-course attendance audit with institutional 75% statutory compliance') + `
<div class="grid sm:grid-cols-3 gap-4 mb-5">
  ${stat('Total Held Classes', totalHeld, 'Semester to date across 5 subjects')}
  ${stat('Total Attended Classes', totalAttended, overallAttPct + '% cumulative attendance rate')}
  ${stat('Courses with Shortage', lowCount, lowCount > 0 ? lowCount + ' courses below mandatory 75%' : 'Full compliance across all courses')}
</div>

<div class="card">
  <div class="flex items-center justify-between mb-4">
    <div>
      <h3 class="font-semibold text-base">📋 Course-Wise Attendance Audit Table</h3>
      <p class="mut text-xs">Tabular attendance register replacing circular gauges with accurate counts and recovery targets</p>
    </div>
    <span class="text-xs mut">Institutional Threshold: 75.0%</span>
  </div>
  <div class="wrap">
    <table>
      <thead>
        <tr>
          <th class="txt-center">Course Code</th>
          <th class="txt-left">Subject Title</th>
          <th class="txt-right">Classes Held</th>
          <th class="txt-right">Classes Attended</th>
          <th class="txt-right">Classes Missed</th>
          <th class="txt-right">Attendance Rate (%)</th>
          <th class="txt-center">Statutory Status</th>
          <th class="txt-left">Actionable Recovery & Margin Requirement</th>
        </tr>
      </thead>
      <tbody>
        ${SUBJ.map(s => {
          const p = attp(s);
          const miss = s.tot - s.att;
          const need = Math.max(0, Math.ceil((0.75 * s.tot - s.att) / 0.25));
          const canMiss = Math.floor(s.att / 0.75 - s.tot);
          const isLow = p < 75;
          return `<tr style="${isLow ? 'background:rgba(254,226,226,0.25)' : ''}">
            <td class="txt-center font-mono text-xs mut font-semibold">${s.c}</td>
            <td class="txt-left"><b>${s.n}</b></td>
            <td class="txt-right">${s.tot}</td>
            <td class="txt-right font-semibold text-emerald-600">${s.att}</td>
            <td class="txt-right ${miss > 10 ? 'font-semibold text-rose-600' : 'mut'}">${miss}</td>
            <td class="txt-right font-bold" style="color:${isLow ? '#dc2626' : '#16a34a'}">${p}%</td>
            <td class="txt-center">${isLow ? badge('Shortage (<75%)', '#fee2e2', '#b91c1c') : badge('Compliant (≥75%)', '#d1fae5', '#047857')}</td>
            <td class="txt-left text-xs">${isLow ? `<span class="text-rose-700 font-semibold">⚠️ Must attend next <b>${need}</b> consecutive classes to recover</span>` : `<span class="text-slate-600">✔ Safe buffer: Can miss up to <b>${canMiss}</b> class(es)</span>`}</td>
          </tr>`;
        }).join('')}
      </tbody>
      <tfoot>
        <tr>
          <td class="txt-center" colspan="2">Aggregate Academic Total / Average</td>
          <td class="txt-right">${totalHeld}</td>
          <td class="txt-right">${totalAttended}</td>
          <td class="txt-right">${totalMissed}</td>
          <td class="txt-right" style="color:${overallAttPct < 75 ? '#dc2626' : '#16a34a'}">${overallAttPct}%</td>
          <td class="txt-center">${overallAttPct < 75 ? badge('Overall Deficit', '#fee2e2', '#b91c1c') : badge('Overall Compliant', '#d1fae5', '#047857')}</td>
          <td class="txt-left text-xs font-normal">Semester cumulative aggregate across all registered courses</td>
        </tr>
      </tfoot>
    </table>
  </div>
</div>`;
}

// 3. MARKS & INSIGHTS VIEW (Replaces Grouped Bar, Stacked Bar & Radar Charts)
function marks() {
  const weakSubjects = SUBJ.filter(s => s.weak.length).sort((a, b) => pct(a) - pct(b));

  return head('Examination Marks Breakdown & Diagnostic Insights', 'Mid-Term and End-Term scoring registers paired with diagnostic study plan tables') + `
<!-- Table 1: Examination Results Register -->
<div class="card mb-5">
  <div class="flex items-center justify-between mb-3">
    <div>
      <h3 class="font-semibold text-base">📝 Examination Marks Breakdown Table</h3>
      <p class="mut text-xs">Replaces stacked / grouped bar charts with verified examination score components</p>
    </div>
    <span class="text-xs mut">Weightage: Mid-Term (50) + End-Term (100) = 150 Total</span>
  </div>
  <div class="wrap">
    <table>
      <thead>
        <tr>
          <th class="txt-center">Code</th>
          <th class="txt-left">Subject Title</th>
          <th class="txt-right">Mid-Term (/50)</th>
          <th class="txt-right">End-Term (/100)</th>
          <th class="txt-right">Total Score (/150)</th>
          <th class="txt-right">Aggregate %</th>
          <th class="txt-center">Grade</th>
          <th class="txt-right">Department Benchmark</th>
          <th class="txt-right">Benchmark Variance</th>
          <th class="txt-center">Performance Status</th>
        </tr>
      </thead>
      <tbody>
        ${SUBJ.map(s => {
          const p = pct(s);
          const total = s.mid + s.end;
          const diff = p - s.dept;
          return `<tr>
            <td class="txt-center font-mono text-xs mut font-semibold">${s.c}</td>
            <td class="txt-left"><b>${s.n}</b></td>
            <td class="txt-right">${s.mid}</td>
            <td class="txt-right">${s.end}</td>
            <td class="txt-right font-semibold">${total}</td>
            <td class="txt-right font-bold">${p}%</td>
            <td class="txt-center"><span class="px-2 py-0.5 rounded text-xs font-bold" style="background:${p < 60 ? '#fee2e2' : 'var(--soft)'};color:${p < 60 ? '#b91c1c' : '#4f46e5'}">${grade(p)}</span></td>
            <td class="txt-right">${s.dept}%</td>
            <td class="txt-right font-semibold ${diff >= 0 ? 'text-emerald-600' : 'text-rose-600'}">${diff > 0 ? '+' + diff : diff}%</td>
            <td class="txt-center">${p >= 80 ? badge('Outstanding', '#d1fae5', '#047857') : p >= 70 ? badge('Satisfactory', '#e0e7ff', '#3730a3') : badge('Underperforming', '#fee2e2', '#b91c1c')}</td>
          </tr>`;

];

const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const FREE = {
  CS301: [['Mon', '15:00', '16:00'], ['Wed', '15:00', '16:00'], ['Fri', '11:00', '12:00']],
  CS302: [['Tue', '11:00', '12:00'], ['Thu', '11:00', '12:00'], ['Fri', '14:00', '15:00']],
  CS303: [['Mon', '10:00', '11:00'], ['Wed', '14:00', '15:00'], ['Fri', '14:00', '15:00']],
  CS304: [['Mon', '10:00', '11:00'], ['Tue', '15:00', '16:00'], ['Thu', '10:00', '11:00']],
  MA305: [['Tue', '13:00', '14:00'], ['Wed', '11:00', '12:00'], ['Fri', '13:00', '14:00']]
};

const tm = s => { const a = s.split(':'); return +a[0] * 60 + +a[1]; };
const fmt12 = m => { const h = Math.floor(m / 60); return ((h + 11) % 12 + 1) + ':' + String(m % 60).padStart(2, '0') + (h < 12 ? ' AM' : ' PM'); };
const slotTxt = s => s[0] + ' ' + fmt12(tm(s[1])) + '–' + fmt12(tm(s[2]));

function status(code) {
  const n = new Date(), d = n.getDay(), m = n.getHours() * 60 + n.getMinutes(), sl = FREE[code];
  const free = sl.some(s => DAYS.indexOf(s[0]) === d && tm(s[1]) <= m && m < tm(s[2]));
  const off = s => { let o = ((DAYS.indexOf(s[0]) - d + 7) % 7) * 1440 + tm(s[1]) - m; return o <= 0 ? o + 10080 : o; };
  const next = [...sl].sort((a, b) => off(a) - off(b))[0];
  return { free, next };
}

// ---------- Navigation & Authentication Logic ----------
function render() {
  document.getElementById('app').innerHTML = S.user ? appView() : loginView();
}

function login(e) {
  e.preventDefault();
  const u = document.getElementById('u').value.trim().toUpperCase();
  const p = document.getElementById('p').value;
  if (!u || !p) {
    S.err = 'Please enter both your roll number and password.';
  } else if (USERS[u] && USERS[u].pw === p) {
    S.user = u;
    S.err = '';
    S.tab = 'overview';
  } else {
    S.err = 'Invalid credentials. Please verify your roll number and password.';
  }
  render();
}

function logout() {
  S.user = null;
  render();
}

function go(t) {
  S.tab = t;
  render();
  window.scrollTo(0, 0);
}

render();
</script>
